            const t = (schemaMeta.tables || []).find((x) => x.tableId === tableId);
            if (!t) return null;
            const c = (schemaMeta.cols || []).find((x) => x.parentId === t.id && x.colId === colId);
            return c ? c.type : null;
        }

        // Le nom de la colonne appartient à qui tient la structure du document : c'est son type qui la
        // désigne, comme dans le Gantt.
        function colonneChantier() {
            if (typeColonne('Tasks', 'chantier') === 'Ref:Chantiers') return 'chantier';
            if (typeColonne('Tasks', 'parentTask') === 'Ref:Chantiers') return 'parentTask';
            const t = schemaMeta && (schemaMeta.tables || []).find((x) => x.tableId === 'Tasks');
            if (!t) return null;
            const c = (schemaMeta.cols || []).find((x) => x.parentId === t.id && x.type === 'Ref:Chantiers');
            return c ? c.colId : null;
        }

        // Une colonne de personnes designe sa table dans son type : la chercher sous un nom fige laissait
        // les pastilles vides des que le document pointait ailleurs que sur Team.
        const TABLE_PERSONNES = 'Team';
        const COLONNES_PERSONNES = [
            ['Projects', 'responsable'], ['Projects', 'Sponsor'], ['Projects', 'Contributeurs_cles'],
            ['Chantiers', 'Responsable'], ['Tasks', 'Responsable'], ['Tasks', 'assignees']
        ];

        function tableDeRef(tableId, colId) {
            const trouve = /^Ref(?:List)?:(.+)$/.exec(typeColonne(tableId, colId) || '');
            return trouve ? trouve[1] : TABLE_PERSONNES;
        }

        const refPersonne = (tableId, colId, v) => (v ? { table: tableDeRef(tableId, colId), id: v } : null);
        const refsPersonnes = (tableId, colId, v) => (Array.isArray(v) && v[0] === 'L' ? v.slice(1) : [])
            .map((valeur) => ({ table: tableDeRef(tableId, colId), id: valeur }));

        function colonneDateChantier(borne) {
            const noms = NOMS_DATE_CHANTIER[borne];
            if (!schemaMeta) return noms[0];
            return noms.find((n) => typeColonne('Chantiers', n) === 'Date') || noms[0];
        }

        // La catégorie se porte tantôt en référence vers une table, tantôt en liste de choix : la valeur
        // suffit à trancher, un identifiant étant un nombre et un choix une chaîne.
        function categorieDuProjet(p) {
            const v = p && p.Categorie;
            if (typeof v === 'number' && v > 0) {
                const c = categories.find((x) => x.id === v);
                return c ? (c.Categorie || '') : '';
            }
            return typeof v === 'string' ? v : '';
        }

        const clefNom = (v) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().toLowerCase();

        // Le serveur ne sert pas toujours l'identifiant d'une reference : sur grist.numerique.gouv.fr une
        // reference simple arrive sous son libelle, la ou une liste garde ses identifiants. Les deux formes
        // doivent retrouver la personne.
        function membre(ref) {
            if (!ref) return null;
            const parId = personnes.get(ref.table + ':' + ref.id);
            if (parId) return parId;
            const parNom = personnes.get(ref.table + '#' + clefNom(ref.id));
            if (parNom) return parNom;
            console.warn('[fiche] personne introuvable', ref.table, ref.id);
            return null;
        }
        const lundiDe = (d) => { const r = new Date(d); r.setDate(r.getDate() - ((r.getDay() + 6) % 7)); r.setHours(0, 0, 0, 0); return r; };

        /**
         * Fenêtre de six mois, du mois précédent au cinquième suivant. Les colonnes étant des semaines,
         * la fenêtre s'ouvre au lundi de la première et se ferme au dimanche de la dernière : sans cela
         * les positions se mesurent depuis le premier du mois et se décalent d'une colonne.
         */
        function fenetre() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const premier = new Date(today.getFullYear(), today.getMonth() - MOIS_AVANT, 1);
            const dernier = new Date(today.getFullYear(), today.getMonth() - MOIS_AVANT + MOIS_TOTAL, 0);
            const debut = lundiDe(premier);
            const fin = lundiDe(dernier);
            fin.setDate(fin.getDate() + 6);
            return { premier: premier, debut: debut, fin: fin, duree: jours(debut, fin) + 1, today: today };
        }

        /** Colonnes hebdomadaires de la fenêtre, chacune rattachée à un des six mois affichés. */
        function colonnes(f) {
            const out = [];
            for (let d = new Date(f.debut); d <= f.fin; d.setDate(d.getDate() + 7)) {
                const debutSemaine = new Date(d);
                const index = Math.min(Math.max((debutSemaine.getFullYear() - f.premier.getFullYear()) * 12 + debutSemaine.getMonth() - f.premier.getMonth(), 0), MOIS_TOTAL - 1);
                out.push({ debut: debutSemaine, mois: index });
            }
            return out;
        }

        /**
         * Position d'une barre, en pourcentage de la fenêtre. La brique px du core sert un Gantt qui
         * défile ; ici la fenêtre est fixe et suit la largeur de l'écran, une position relative la rend
         * responsive sans recalcul au redimensionnement.
         */
        function barre(f, debut, fin) {
            if (!debut || !fin) return null;
            const d = Math.max(jours(f.debut, debut), 0);
            const t = Math.min(jours(f.debut, fin) + 1, f.duree);
            if (t <= 0 || d >= f.duree) return null;
            return { gauche: (d / f.duree) * 100, largeur: Math.max(((t - d) / f.duree) * 100, 0.6) };
        }

        /** Chantiers du projet, chacun suivi de ses tâches. */
        function lignes() {
            const colChantier = colonneChantier();
            const colDebut = colonneDateChantier('debut');
            const colFin = colonneDateChantier('fin');
            const duProjet = chantiers.filter((c) => listeRefs(c.Projets).indexOf(projet.id) !== -1);
            // Même arbre que le Gantt, pour que les progressions affichées soient les mêmes.
            const hierarchie = typeColonne('Tasks', 'parentTask') === 'Ref:Tasks';
            const arbre = TF.construireArbre(duProjet.map((c) => ({ id: TF.ID_CHANTIER + c.id }))
                .concat(taches.map((t) => Object.assign({}, t, { parentTask: TF.parentAvecChantier(t, colChantier, hierarchie) }))));
            const out = [];
            duProjet.forEach((c) => {
                const filles = colChantier ? taches.filter((t) => t[colChantier] === c.id) : [];
                const debuts = filles.map((t) => t.dateDebut).filter(Boolean);
                const fins = filles.map((t) => t.dateEcheance).filter(Boolean);
                out.push({
                    id: 'c' + c.id, chantier: true, titre: c.Nom_du_chantier || 'Sans titre',
                    debut: gristVersDate(c[colDebut] || (debuts.length ? Math.min.apply(null, debuts) : null)),
                    fin: gristVersDate(c[colFin] || (fins.length ? Math.max.apply(null, fins) : null)),
                    responsable: refPersonne('Chantiers', 'Responsable', c.Responsable), filles: filles.length,
                    progression: arbre.progression(arbre.tache(TF.ID_CHANTIER + c.id))
                });
                if (chantiersReplies.has(c.id)) return;
                filles.forEach((t) => out.push({
                    id: 't' + t.id, chantier: false, titre: t.titre || 'Sans titre',
                    debut: gristVersDate(t.dateDebut), fin: gristVersDate(t.dateEcheance),
                    responsable: refPersonne('Tasks', 'Responsable', t.Responsable), progression: arbre.progression(arbre.tache(t.id)),
                    parent: c.id, jalon: t.type === 'jalon'
                }));
            });
            return out;
        }

        function bloc(classe, libelle, contenu, icone) {
            return '<div class="fiche-bloc ' + classe + '"><div class="fiche-label">' + picto(icone) + echapper(libelle) + '</div>'
                + '<div class="fiche-valeur">' + (contenu || '<span class="vide">Non renseigné</span>') + '</div></div>';
        }

        function pastilles(refs) {
            if (!refs.length) return '';
            return refs.map((ref) => {
                const m = membre(ref);
                if (!m) return '';
                const domaine = domaineDe(ref);
                return '<span class="fiche-personne" style="background-color:' + echapper(domaine ? domaine.couleur : GRIS_SANS_DOMAINE) + '">'
                    + echapper(m.nom) + '</span>';
            }).join('');
        }

        function colonneMeta(tableId, colId) {
            if (!schemaMeta) return null;
            const t = (schemaMeta.tables || []).find((x) => x.tableId === tableId);
            return (t && (schemaMeta.cols || []).find((x) => x.parentId === t.id && x.colId === colId)) || null;
        }

        // Une colonne calculée ou absente ne s'écrit pas : Grist refuserait l'écriture entière.
        function colonneEcrivable(tableId, colId) {
            const c = colonneMeta(tableId, colId);
            return Boolean(c && !TF.estCalculee(c));
        }

        // Champs de Projects modifiables depuis la fiche. L'actualité n'est pas historisée, la saisie
        // remplace la précédente ; vide ou sans colonne, elle ne s'affiche pas.
        const DESCRIPTION = { colonne: 'Description', classe: 'bloc-description', libelle: 'Description', icone: 'description' };
        const ACTUALITES = { colonne: 'Actualites', classe: 'bloc-actualites', libelle: 'Actualités', icone: 'actualite' };
        let saisies = [DESCRIPTION, ACTUALITES];
        const idSaisie = (s) => 'saisie-' + s.classe.split(' ')[0];

        // Les colonnes de la maquette n'ont pas d'identifiant arrêté d'un document à l'autre : on les
        // reconnaît à leur libellé, accents, casse et ponctuation ignorés.
        const normaliser = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '');

        function colonneParLibelle(libelles) {
            if (!schemaMeta) return null;
            const t = (schemaMeta.tables || []).find((x) => x.tableId === 'Projects');
            if (!t) return null;
            const voulus = libelles.map(normaliser);
            const c = (schemaMeta.cols || []).find((x) => x.parentId === t.id
                && (voulus.indexOf(normaliser(x.label)) !== -1 || voulus.indexOf(normaliser(x.colId)) !== -1));
            return c ? c.colId : null;
        }

        // Chaque gabarit n'affiche que les champs que le document « Colonnes des fiches PMO » lui donne.
        const TOUS_GABARITS = ['Projet', 'Produit', 'Offre de service'];
        const CHAMPS_CADRAGE = [
            { cle: 'objectif', libelles: ['Objectifs ou principales fonctionnalités', 'Objectif / principales fonctionnalités', 'Objectif'], libelle: 'Objectif', gabarits: TOUS_GABARITS },
            { cle: 'cible', libelles: ['Public cible', 'Cible'], libelle: 'Cible', gabarits: TOUS_GABARITS },
            { cle: 'perimetre', libelles: ['Périmètre données'], libelle: 'Périmètre données', gabarits: ['Produit', 'Offre de service'] },
            { cle: 'contraintes', libelles: ['Contraintes et cadre'], libelle: 'Contraintes et cadre', gabarits: TOUS_GABARITS },
            { cle: 'modalites', libelles: ['Modalités de réalisation'], libelle: 'Modalités de réalisation', gabarits: ['Offre de service'] },
            { cle: 'maturite', libelles: ['Maturité'], libelle: 'Maturité', gabarits: TOUS_GABARITS }
        ];
        const GABARITS_INDICATEURS = ['Produit', 'Offre de service'];
        const NB_INDICATEURS = 3;

        function saisiesDuCadrage(categorie) {
            const champs = {};
            for (const c of CHAMPS_CADRAGE) {
                const colonne = c.gabarits.indexOf(categorie) !== -1 ? colonneParLibelle(c.libelles) : null;
                if (colonne) champs[c.cle] = { colonne: colonne, classe: 'bloc-' + c.cle + ' bloc-texte', libelle: c.libelle, icone: c.cle };
            }
            return champs;
        }

        const blocChamp = (champ) => (champ ? blocSaisie(champ) : '');

        function champSaisie(s) {
            return '<textarea id="' + idSaisie(s) + '" class="fiche-saisie" rows="1" placeholder="Non renseigné">'
                + echapper(projet[s.colonne] == null ? '' : projet[s.colonne]) + '</textarea>';
        }

        function blocSaisie(s) {
            if (!colonneEcrivable('Projects', s.colonne)) return bloc(s.classe, s.libelle, texteOuVide(projet[s.colonne]), s.icone);
            return '<div class="fiche-bloc ' + s.classe + '"><label class="fiche-label" for="' + idSaisie(s) + '">' + picto(s.icone) + echapper(s.libelle) + '</label>'
                + '<div class="fiche-valeur">' + champSaisie(s) + '</div></div>';
        }

        const blocActualites = () => (colonneMeta('Projects', ACTUALITES.colonne) ? blocSaisie(ACTUALITES) : '');

        function prochainJalon() {
            const colChantier = colonneChantier();
            const duProjet = new Set(chantiers.filter((c) => listeRefs(c.Projets).indexOf(projet.id) !== -1).map((c) => c.id));
            const aujourdhui = new Date();
            aujourdhui.setHours(0, 0, 0, 0);
            return taches
                .filter((t) => t.type === 'jalon' && (t.projet === projet.id || (colChantier && duProjet.has(t[colChantier]))))
                .map((t) => ({ titre: t.titre, date: gristVersDate(t.dateEcheance || t.dateDebut) }))
                .filter((j) => j.date && j.date >= aujourdhui)
                .sort((a, b) => a.date - b.date)[0] || null;
        }

        function blocProchainJalon() {
            const j = prochainJalon();
            if (!j) return '';
            return '<div class="fiche-bloc bloc-jalon"><div class="fiche-label">' + picto('jalon') + 'Prochain jalon clé'
                + '<span class="fiche-jalon-date">' + echapper(j.date.toLocaleDateString('fr-FR')) + '</span></div>'
                + '<div class="fiche-jalon-titre">' + echapper(j.titre || 'Sans titre') + '</div></div>';
        }

        // Grist écrit en noir un choix qui n'a qu'une couleur de fond.
        function couleursDuChoix(colonne, valeur) {
            let options = {};
            try {
                options = (JSON.parse((colonne && colonne.widgetOptions) || '{}').choiceOptions || {})[valeur] || {};
            } catch (e) {
                console.warn(LOG, 'options illisibles sur', colonne.colId);
            }
            const style = (options.fillColor ? 'background-color:' + options.fillColor + ';' : '')
                + (options.textColor || options.fillColor ? 'color:' + (options.textColor || '#000000') + ';' : '');
            return style ? ' style="' + echapper(style) + '"' : '';
        }

        function blocStatut() {
            if (!colonneMeta('Projects', 'Statut')) return '';
            const valeur = texteOuVide(projet.Statut);
            if (!valeur) return bloc('bloc-statut', 'Statut', '');
            const colCommentaire = colonneParLibelle(['Commentaires sur le statut', 'Commentaire sur le statut']);
            const commentaire = colCommentaire ? texteOuVide(projet[colCommentaire]) : '';
            const aide = commentaire
                ? '<span class="fiche-statut-aide" tabindex="0" aria-label="Commentaire sur le statut">?</span>'
                    + '<span class="fiche-statut-bulle" role="tooltip">' + commentaire + '</span>'
                : '';
            return bloc('bloc-statut', 'Statut', '<span class="fiche-statut-ligne"><span class="fiche-statut"'
                + couleursDuChoix(colonneMeta('Projects', 'Statut'), projet.Statut) + '>' + valeur + '</span>' + aide + '</span>');
        }

        // Une cellule « lien » de Grist s'écrit « libellé adresse » ou « adresse » seule. Seule une adresse
        // web devient un lien, le reste s'affiche tel quel.
        function lienDe(valeur) {
            const brut = valeur == null ? '' : String(valeur).trim();
            if (!brut) return '';
            const morceaux = brut.split(/\s+/);
            const adresse = morceaux[morceaux.length - 1];
            if (!/^https?:\/\//i.test(adresse)) return echapper(brut);
            const libelle = morceaux.length > 1 ? morceaux.slice(0, -1).join(' ') : adresse;
            return '<a class="fiche-lien" href="' + echapper(adresse) + '" target="_blank" rel="noopener noreferrer">'
                + echapper(libelle) + picto('lien') + '</a>';
        }

        const GABARITS_ACCES = ['Produit', 'Offre de service'];
        const ACCES = [
            { classe: 'bloc-acces-outil', libelles: ["Accès à l'outil", 'Acces outil'], libelle: "Accès à l'outil" },
            { classe: 'bloc-acces-documentation', libelles: ['Accès à la documentation', 'Acces documentation'], libelle: 'Accès à la documentation' }
        ];

        function blocsAcces(categorie) {
            if (GABARITS_ACCES.indexOf(categorie) === -1) return '';
            return ACCES.map((a) => {
                const col = colonneParLibelle(a.libelles);
                return col ? bloc(a.classe, a.libelle, lienDe(projet[col])) : '';
            }).join('');
        }

        function blocIndicateurs(categorie) {
            if (GABARITS_INDICATEURS.indexOf(categorie) === -1) return '';
            const chiffres = [];
            for (let i = 1; i <= NB_INDICATEURS; i++) {
                const colValeur = colonneParLibelle(['Data - Ind. clé ' + i, 'Donnée indicateur ' + i]);
                const colLibelle = colonneParLibelle(['Libellé - Ind. clé ' + i, 'Indicateur ' + i]);
                const valeur = colValeur ? texteOuVide(projet[colValeur]) : '';
                if (!valeur) continue;
                chiffres.push('<div class="fiche-indicateur"><span class="fiche-indicateur-valeur">' + valeur + '</span>'
                    + '<span class="fiche-indicateur-libelle">' + (colLibelle ? texteOuVide(projet[colLibelle]) : '') + '</span></div>');
            }
            return chiffres.length ? '<div class="fiche-indicateurs">' + chiffres.join('') + '</div>' : '';
        }

        function blocVisuel() {
            const col = colonneParLibelle(['Visuel']);
            const piece = col ? listeRefs(projet[col])[0] : null;
            if (!piece) return '';
            const colTitre = colonneParLibelle(['Titre du visuel']);
            const titre = colTitre ? texteOuVide(projet[colTitre]) : '';
            return '<div class="fiche-bloc bloc-visuel">' + (titre ? '<div class="fiche-label">' + titre + '</div>' : '')
                + '<img class="fiche-visuel" data-piece="' + Number(piece) + '" alt="' + (titre || 'Visuel') + '"></div>';
        }

        // Une pièce jointe ne se lit qu'avec un jeton d'accès, valable quelques minutes.
        let jeton = null;
        async function urlPieceJointe(id) {
            if (!jeton || jeton.expire < Date.now()) {
                const t = await grist.docApi.getAccessToken({ readOnly: true });
                jeton = { token: t.token, baseUrl: t.baseUrl, expire: Date.now() + (t.ttlMsecs || 60000) - 10000 };
            }
            return jeton.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(jeton.token);
        }

        function chargerVisuels(racine) {
            racine.querySelectorAll('img[data-piece]').forEach((img) => {
                urlPieceJointe(img.dataset.piece)
                    .then((url) => { img.src = url; })
                    .catch((e) => console.warn(LOG, 'visuel illisible :', (e && e.message) || e));
            });
        }

        // Zone utile d'un A4 paysage à 10 mm de marge, en px CSS.
        const PAGE_IMPRIMEE = { largeur: Math.floor(277 * 96 / 25.4), hauteur: Math.floor(190 * 96 / 25.4) };
        const DELAI_VISUELS = 5000;
        let impression = null;

        function attendreVisuels(racine) {
            return Promise.all(Array.from(racine.querySelectorAll('img[data-piece]')).map((img) => new Promise((fini) => {
                if (img.getAttribute('src') && img.complete) return fini();
                img.addEventListener('load', fini, { once: true });
                img.addEventListener('error', fini, { once: true });
                setTimeout(fini, DELAI_VISUELS);
            })));
        }

        function mettreEnPage(racine, largeur) {
            racine.style.width = largeur + 'px';
            document.querySelectorAll('.fiche-saisie').forEach(ajusterHauteur);
            return racine.getBoundingClientRect().height;
        }

        const deuxChiffres = (n) => String(n).padStart(2, '0');
        const mentionEdition = () => 'Fiche éditée le ' + new Date().toLocaleDateString('fr-FR');

        async function exporter(bouton) {
            if (impression) return;
            impression = { titre: document.title };
            bouton.disabled = true;
            const racine = el('fiche');
            try {
                await Promise.all([attendreVisuels(racine), document.fonts ? document.fonts.ready : null]);
                const jour = new Date();
                const pied = racine.querySelector('.fiche-pied');
                if (pied) pied.textContent = mentionEdition();
                document.documentElement.classList.add('impression');
                const echelle = TF.echelleDImpression(Object.assign({ mesurer: (l) => mettreEnPage(racine, l) }, PAGE_IMPRIMEE));
                mettreEnPage(racine, echelle.largeur);
                racine.style.zoom = echelle.zoom;
                document.title = 'Fiche - ' + (projet.nom || 'Sans titre') + ' - '
                    + jour.getFullYear() + '-' + deuxChiffres(jour.getMonth() + 1) + '-' + deuxChiffres(jour.getDate());
                window.addEventListener('afterprint', finirImpression, { once: true });
                window.print();
            } catch (e) {
                console.warn(LOG, 'export impossible :', (e && e.message) || e);
                finirImpression();
            }
        }

        function finirImpression() {
            const racine = el('fiche');
            document.documentElement.classList.remove('impression');
            racine.style.removeProperty('width');
            racine.style.removeProperty('zoom');
            if (impression) document.title = impression.titre;
            impression = null;
            document.querySelectorAll('.fiche-saisie').forEach(ajusterHauteur);
            const bouton = racine.querySelector('.fiche-export');
            if (bouton) bouton.disabled = false;
        }

        function ajusterHauteur(champ) {
            // Rendue dans une iframe masquée, la case n'a pas encore de hauteur à mesurer.
            if (!champ.scrollHeight) return;
            champ.style.height = 'auto';
            champ.style.height = (champ.scrollHeight + champ.offsetHeight - champ.clientHeight) + 'px';
        }

        async function enregistrerSaisie(s, champ) {
            const valeur = champ.value;
            if (!projet || valeur === (projet[s.colonne] == null ? '' : String(projet[s.colonne]))) return;
            try {
                await grist.docApi.applyUserActions([['UpdateRecord', 'Projects', projet.id, { [s.colonne]: valeur }]]);
                projet[s.colonne] = valeur;
            } catch (e) {
                console.error(LOG, s.libelle, 'refusée :', (e && e.message) || e);
                const valeurChamp = champ.closest('.fiche-valeur');
                if (valeurChamp && !valeurChamp.querySelector('.fiche-erreur')) {
                    valeurChamp.insertAdjacentHTML('beforeend', '<p class="fiche-erreur">' + echapper(s.libelle) + ' non enregistrée : '
                        + echapper((e && e.message) || e) + '</p>');
                }
            }
        }

        // Domaine d'une personne, à la couleur que le Gantt donne à ce domaine.
        function domaineDe(ref) {
            const m = ref ? membre(ref) : null;
            if (!m || !m.Domaine) return null;
            return { nom: m.Domaine, couleur: TF.couleurDeDomaine(equipes.get(ref.table) || [], m.Domaine) };
        }

        const domaineDuChantier = (r) => (r.chantier ? domaineDe(r.responsable) : null);

        function texteOuVide(v) {
            const s = v == null ? '' : String(v).trim();
            return s ? echapper(s) : '';
        }

        function dateCourte(ts) {
            const d = gristVersDate(ts);
            return d ? d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        }

        function enTete(exportable) {
            const type = texteOuVide(projet.Type);
            return '<header class="fiche-entete">'
                + '<h1 class="fiche-titre">' + echapper(projet.nom || 'Sans titre') + '</h1>'
                + (type ? '<span class="fiche-type">' + type + '</span>' : '')
                + (exportable ? '<button type="button" class="fiche-export">' + picto('export') + 'Exporter en PDF</button>' : '')
                + '</header>';
        }

        // Projet : budget, commanditaires et deadline. Offre de service : le budget, à côté des modalités de
        // réalisation. Produit : aucun des trois.
        function blocsDeBase(categorie, modalites) {
            const colBudget = colonneParLibelle(['Budget alloué ou coût', 'Budget alloué']) || 'Budget_alloue';
            const budget = () => bloc('bloc-budget', 'Budget alloué', texteOuVide(projet[colBudget]), 'budget');
            if (categorie === 'Projet') {
                return '<div class="fiche-trio">' + budget()
                    + bloc('bloc-commanditaires', 'Commanditaires', texteOuVide(projet.Commanditaires), 'commanditaires')
                    + bloc('bloc-deadline', 'Deadline commanditaires', texteOuVide(dateCourte(projet.Deadline_commanditaire)), 'deadline')
                    + '</div>';
            }
            if (categorie === 'Offre de service') return '<div class="fiche-duo fiche-trio">' + budget() + blocChamp(modalites) + '</div>';
            return blocChamp(modalites);
        }

        function cadrage(categorie) {
            const champs = saisiesDuCadrage(categorie);
            saisies = [DESCRIPTION, ACTUALITES].concat(Object.keys(champs).map((k) => champs[k]));
            const droite = blocIndicateurs(categorie) + blocVisuel();
            const duoCible = blocChamp(champs.cible) + blocChamp(champs.perimetre);
            return '<section class="fiche-cadrage">'
                + '<div class="fiche-colonne">'
                + blocStatut()
                + bloc('bloc-responsable', 'Responsable', pastilles([refPersonne('Projects', 'responsable', projet.responsable)].filter(Boolean))
                    || '<span class="fiche-alerte">' + ICONE_ERREUR + 'Aucun</span>')
                + bloc('bloc-sponsors', 'Sponsors', pastilles(refsPersonnes('Projects', 'Sponsor', projet.Sponsor)))
                + bloc('bloc-contributeurs', 'Contributeurs clés', pastilles(refsPersonnes('Projects', 'Contributeurs_cles', projet.Contributeurs_cles)))
                + blocChamp(champs.maturite)
                + blocsAcces(categorie)
                + '</div>'
                + '<div class="fiche-colonne large">'
                + '<div class="fiche-duo">' + blocActualites() + blocProchainJalon() + '</div>'
                + blocSaisie(DESCRIPTION)
                + blocChamp(champs.objectif)
                + (duoCible ? '<div class="fiche-duo">' + duoCible + '</div>' : '')
                + blocChamp(champs.contraintes)
                + blocsDeBase(categorie, champs.modalites)
                + '</div>'
                + (droite ? '<div class="fiche-colonne droite">' + droite + '</div>' : '')
                + '</section>';
        }

        function feuilleDeRoute() {
            const f = fenetre();
            const cols = colonnes(f);
            const rangs = lignes();
            const nbChantiers = rangs.filter((r) => r.chantier).length;

            if (!nbChantiers) {
                return '<section class="fiche-route"><h2>Feuille de route</h2>'
                    + '<p class="fiche-message">Aucun chantier n\'est rattaché à ce projet.</p></section>';
            }

            const mois = [];
            for (let i = 0; i < MOIS_TOTAL; i++) {
                const d = new Date(f.premier.getFullYear(), f.premier.getMonth() + i, 1);
                const largeur = cols.filter((c) => c.mois === i).length;
                mois.push('<div class="fiche-mois" style="flex:' + largeur + '">' + echapper(d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '')) + '</div>');
            }

            const lundiCourant = lundiDe(f.today);

            const pourcent = (d) => (jours(f.debut, d) / f.duree) * 100;
            const aujourdhui = pourcent(f.today);
            const colonneCourante = { gauche: pourcent(lundiCourant), largeur: (7 / f.duree) * 100 };

            const losange = (r, teinte) => {
                const d = r.fin || r.debut;
                const position = d ? ((jours(f.debut, d) + 0.5) / f.duree) * 100 : -1;
                return position >= 0 && position <= 100
                    ? '<span class="fiche-jalon" style="left:' + position.toFixed(2) + '%;--teinte:' + echapper(teinte) + '"></span>'
                    : '';
            };

            const corps = rangs.map((r) => {
                const b = r.jalon ? null : barre(f, r.debut, r.fin);
                const replie = chantiersReplies.has(Number(r.id.slice(1)));
                const chevron = r.chantier && r.filles
                    ? '<button class="fiche-chevron" data-chantier="' + r.id.slice(1) + '" aria-label="Replier ou déplier">' + (replie ? '▶' : '▼') + '</button>'
                    : '<span class="fiche-chevron-vide"></span>';
                const teinte = r.responsable && membre(r.responsable) ? (membre(r.responsable).couleur || '#3e5de7') : '#4a9ae0';
                const domaine = domaineDuChantier(r);
                const bandeau = (avecNom) => (domaine
                    ? '<span class="bandeau-domaine" style="background-color:' + echapper(domaine.couleur) + '">' + (avecNom ? echapper(domaine.nom) : '') + '</span>'
                    : '');
                return '<div class="fiche-rang' + (r.chantier ? ' est-chantier' : '') + (domaine ? ' avec-domaine' : '') + '"'
                    + (domaine ? ' style="--teinte-domaine:' + echapper(domaine.couleur) + '"' : '') + '>'
                    + '<div class="fiche-ligne">' + bandeau(true) + chevron
                    + '<span class="fiche-intitule"><span class="fiche-nom">' + echapper(r.titre) + '</span></span>'
                    + (r.jalon ? '' : '<span class="fiche-progression">' + Math.round(r.progression || 0) + '%</span>')
                    + (r.filles ? '<span class="fiche-filles">↳' + r.filles + '</span>' : '')
                    + '</div>'
                    + '<div class="fiche-piste">' + bandeau(false) + (r.jalon ? losange(r, teinte) : '')
                    + (b ? '<span class="fiche-barre" style="left:' + b.gauche.toFixed(2) + '%;width:' + b.largeur.toFixed(2) + '%;--teinte:' + echapper(teinte) + '">'
                        + (r.progression ? '<span class="fiche-avancee" style="width:' + Math.min(Math.max(r.progression, 0), 100) + '%"></span>' : '')
                        + '</span>' : '')
                    + '</div></div>';
            }).join('');

            return '<section class="fiche-route">'
                + '<div class="fiche-grille">'
                + '<div class="fiche-entetes"><div class="fiche-ligne fiche-ligne-tete">Chantiers et tâches</div>'
                + '<div class="fiche-piste fiche-piste-tete"><div class="fiche-mois-ligne">' + mois.join('') + '</div></div></div>'
                + '<div class="fiche-corps"><div class="fiche-pile">'
                + '<div class="fiche-overlay fiche-fond"><div class="fiche-colonne-courante" style="left:' + colonneCourante.gauche.toFixed(2) + '%;width:' + colonneCourante.largeur.toFixed(2) + '%"></div></div>'
                + corps
                + '<div class="fiche-overlay"><div class="fiche-aujourdhui" style="left:' + aujourdhui.toFixed(2) + '%"></div></div>'
                + '</div></div></div></section>';
        }

        // Une categorie sans fiche annonce celle qui vient, plutot que de renvoyer l'utilisateur a ce
        // que le widget ne fait pas.
        function ficheAVenir(categorie) {
            return '<div class="fiche-bientot">'
                + '<span class="fiche-bientot-vignette" aria-hidden="true">' + ETINCELLES + '</span>'
                + '<p class="fiche-bientot-titre">La fiche ' + echapper(categorie) + ' arrive bientôt !</p>'
                + '<p class="fiche-bientot-texte">Une fiche adaptée à ' + echapper(projet.nom || 'cette ligne')
                + ' est en préparation.</p>'
                + '</div>';
        }

        // Sans selection, le widget n'a rien a montrer : plutot qu'une ligne de texte, la meme carte que la
        // fiche a venir, avec la fleche qui designe le tableau ou cliquer.
        function accueil() {
            return '<div class="fiche-bientot fiche-accueil">'
                + '<span class="fiche-bientot-vignette" aria-hidden="true">' + ETINCELLES + '</span>'
                + '<p class="fiche-bientot-titre">Une fiche vous attend</p>'
                + '<p class="fiche-bientot-texte">Cadrage, entourage et feuille de route des chantiers s’affichent ici.</p>'
                + '<p class="fiche-accueil-guide"><span class="fiche-accueil-fleche" aria-hidden="true">' + FLECHE + '</span>'
                + '<span>Choisissez un projet dans le sélecteur ci-dessus</span></p>'
                + '</div>';
        }

        let rendu = false;

        function rendre() {
            const racine = el('fiche');
            if (!projet) {
                racine.innerHTML = accueil();
                return;
            }
            const categorie = categorieDuProjet(projet);
            // Sans catégorie lisible, on sert la fiche par défaut : un document qui ne porte pas la colonne
            // n'a pas à se retrouver devant une annonce de fiche à venir.
            const gabarit = categorie ? GABARITS[categorie] : GABARITS['Projet'];
            if (!gabarit) {
                racine.style.removeProperty('--teinte-fiche');
                racine.innerHTML = enTete() + ficheAVenir(categorie);
                return;
            }
            const domaine = domaineDe(refPersonne('Projects', 'responsable', projet.responsable));
            racine.style.setProperty('--teinte-fiche', domaine ? domaine.couleur : GRIS_SANS_DOMAINE);
            // Une relecture des tables redessine la fiche : la saisie en cours y survit, curseur compris.
            const actif = document.activeElement;
            const enCours = actif && actif.classList && actif.classList.contains('fiche-saisie')
                ? { id: actif.id, valeur: actif.value, debut: actif.selectionStart, fin: actif.selectionEnd }
                : null;
            rendu = true;
            racine.innerHTML = enTete(true) + messageDeRefus() + cadrage(categorie && GABARITS[categorie] ? categorie : 'Projet')
                + (gabarit.feuilleDeRoute ? feuilleDeRoute() : '')
                + '<p class="fiche-pied"></p>';
            rendu = false;
            chargerVisuels(racine);
            saisies.forEach((s) => {
                const saisie = el(idSaisie(s));
                if (!saisie) return;
                if (enCours && enCours.id === saisie.id) {
                    saisie.value = enCours.valeur;
                    saisie.focus();
                    saisie.setSelectionRange(enCours.debut, enCours.fin);
                }
                saisie.addEventListener('blur', () => { if (!rendu) enregistrerSaisie(s, saisie); });
                saisie.addEventListener('input', () => ajusterHauteur(saisie));
                ajusterHauteur(saisie);
            });
            racine.querySelectorAll('.fiche-chevron').forEach((b) => b.addEventListener('click', () => {
                const id = Number(b.dataset.chantier);
                if (chantiersReplies.has(id)) chantiersReplies.delete(id); else chantiersReplies.add(id);
                rendre();
            }));
            const exporte = racine.querySelector('.fiche-export');
            if (exporte) {
                exporte.disabled = !!impression;
                exporte.addEventListener('click', () => exporter(exporte));
            }
            // Une relecture pendant l'impression redessine la fiche : le pied doit rester rempli.
            const pied = racine.querySelector('.fiche-pied');
            if (pied && impression) pied.textContent = mentionEdition();
        }

        const LOG = '[fiche]';
        // Tables déclarées par le document : demander une table absente fait remonter une erreur du bac à
        // sable de Grist dans la console, avant même que notre garde ne la voie.
        const tableDeclaree = (nom) => !schemaMeta || (schemaMeta.tables || []).some((t) => t.tableId === nom);

        // Lectures encore en vol, par nom de table. Une lecture qui ne résout ni n'échoue laisserait la
        // fiche sur son texte de chargement sans que rien ne désigne la table qui manque.
        const lecturesEnAttente = new Set();
        const DELAI_SANS_REPONSE = 10000;
        // Tables déclarées par le document mais refusées à la lecture : un problème de droits donne le même
        // écran vide qu'une donnée absente, et rien ne les distinguait.
        let tablesRefusees = new Set();
        let chargementCourant = 0;
        let tablesChargees = false;

        async function lire(table) {
            if (!tableDeclaree(table)) return [];
            lecturesEnAttente.add(table);
            try {
                return TF.columnarToRows(await grist.docApi.fetchTable(table));
            } catch (e) {
                console.warn(LOG, 'lecture refusée sur', table, ':', (e && e.message) || e);
                tablesRefusees.add(table);
                return [];
            } finally {
                lecturesEnAttente.delete(table);
            }
        }

        // Chargement encore en vol au bout du délai : nommer les tables qui n'ont pas répondu, et le dire
        // à l'écran. Pas de repli sur des données d'exemple, les lectures pouvant encore aboutir.
        function signalerAttente(sequence) {
            if (sequence !== chargementCourant || !lecturesEnAttente.size || projet) return;
            const noms = Array.from(lecturesEnAttente).join(', ');
            console.warn(LOG, 'aucune réponse pour', noms, 'après', Math.round(DELAI_SANS_REPONSE / 1000) + 's');
            el('fiche').innerHTML = '<p class="fiche-message">En attente de Grist. Pas de réponse pour '
                + echapper(noms) + '. La fiche s’affichera dès l’arrivée des données.</p>';
        }

        function messageDeRefus() {
            if (!tablesRefusees.size) return '';
            return '<p class="fiche-message fiche-refus">Lecture refusée sur : '
                + echapper(Array.from(tablesRefusees).join(', '))
                + '. La fiche est incomplète, vérifiez vos accès à ces tables.</p>';
        }

        /** Tables où pointent les colonnes de personnes : le type de chaque colonne les désigne. */
        const tablesDePersonnes = () => Array.from(new Set(
            [TABLE_PERSONNES].concat(COLONNES_PERSONNES.map((c) => tableDeRef(c[0], c[1])))));

        function indexerPersonnes(tables, lots) {
            personnes = new Map();
            equipes = new Map();
            tables.forEach((table, i) => {
                equipes.set(table, lots[i]);
                if (!lots[i].length) console.warn(LOG, 'aucune personne lue dans', table);
                lots[i].forEach((m) => {
                    personnes.set(table + ':' + m.id, m);
                    if (m.nom) personnes.set(table + '#' + clefNom(m.nom), m);
                });
            });
        }

        // Une sélection ne change que la ligne affichée : les tables, elles, ne bougent qu'à la main d'un
        // utilisateur. Les relire à chaque clic coûtait sept allers-retours et 250 ko sur le document du
        // métier, pour rendre exactement les mêmes données.
        async function chargerTables() {
            const sequence = ++chargementCourant;
            tablesRefusees = new Set();
            const attente = setTimeout(() => signalerAttente(sequence), DELAI_SANS_REPONSE);
            try { schemaMeta = await TF.fetchSchemaMeta(grist); } catch (e) { schemaMeta = null; }
            const tablesPersonnes = tablesDePersonnes();
            const lots = await Promise.all(
                [lire('Chantiers'), lire('Tasks'), lire('Categorie_de_projet')]
                    .concat(tablesPersonnes.map((t) => lire(t))));
            const [lesChantiers, lesTaches, lesCategories] = lots;
            clearTimeout(attente);
            // Une lecture partie avant celle-ci ne doit pas réinstaller son état par-dessus le nôtre.
            if (sequence !== chargementCourant) return false;
            chantiers = lesChantiers;
            taches = lesTaches;
            categories = lesCategories;
            indexerPersonnes(tablesPersonnes, lots.slice(3));
            tablesChargees = true;
            return true;
        }

        /**
         * L'enregistrement servi par onRecord dépend d'options que le serveur applique à sa façon : seul
         * son identifiant est fiable, les valeurs se lisent dans la table comme celles des autres.
         */
        async function charger(selectionne, relire) {
            if (relire || !tablesChargees) {
                if (!(await chargerTables())) return;
            }
            const sequence = chargementCourant;
            const projets = await lire('Projects');
            if (sequence !== chargementCourant) return;
            projet = projets.find((p) => p.id === (selectionne || {}).id) || selectionne || null;
            rendre();
        }

        function demarrer() {
            try {
                grist.ready({ requiredAccess: 'full' });
                grist.onRecord(async (record) => await charger(record),
                    { expandRefs: false, keepEncoded: true, includeColumns: 'normal' });
                // Grist ne notifie que la table du widget : une modification dans les chantiers, les tâches
                // ou les effectifs passerait inaperçue sans cette relecture.
                grist.onRecords(async () => await charger(projet, true));
                window.addEventListener('resize', () => document.querySelectorAll('.fiche-saisie').forEach(ajusterHauteur));
            } catch (e) {
                el('fiche').innerHTML = '<p class="fiche-message">Cette fiche s’ouvre depuis un document Grist.</p>';
            }
        }

        demarrer();
        // </inline>
    </script>
</body>
</html>
