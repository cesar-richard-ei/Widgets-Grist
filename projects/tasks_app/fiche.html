    <style>
        :root {
            --fond: #ffffff;
            --fond-doux: #f5f7fb;
            --texte: #292929;
            --texte-libelle: #414141;
            --texte-doux: #6b7280;
            --trait: #e5e7eb;
            --accent: #1e78d3;
            --accent-clair: #eaf1fd;
            --fond-saisie: #eef4fc;
            --aujourdhui: #ef4444;
            --rayon: 6px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fond: #0b1220; --fond-doux: #16213a; --texte: #e5e7eb; --texte-doux: #94a3b8;
                --texte-libelle: #cbd5e1;
                --trait: #1e293b; --accent-clair: #16213a; --fond-saisie: #1b2a47;
            }
        }
        * { box-sizing: border-box; }
        button, input, select, textarea { font-family: inherit; }
        body {
            margin: 0; background: var(--fond); color: var(--texte);
            font: 15px/1.5 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .fiche { padding: 0 0 24px; }

        .fiche-entete {
            background: var(--teinte-fiche, var(--accent)); color: #fff; padding: 47px 34px 36px;
            display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
        }
        .fiche-titre { margin: 0; font-size: clamp(1.2rem, 2.1vw, 1.85rem); line-height: 1.15; font-weight: 800; letter-spacing: -0.015em; }
        /* La maquette pose le type comme une etiquette collee sur le bandeau, legerement de
           travers et debordant sur sa droite. */
        .fiche-type {
            margin-left: auto; margin-right: 29px; background: #fff; color: var(--teinte-fiche, var(--accent));
            border-radius: 999px; padding: 4px 18px; font-weight: 800; line-height: 1.2;
            font-size: clamp(0.95rem, 1.6vw, 1.35rem); white-space: nowrap;
            transform: rotate(3deg); box-shadow: 5px 6px 10px rgba(0, 0, 0, 0.16);
        }
        .fiche-export {
            flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
            background: rgba(255, 255, 255, 0.16); color: #fff; border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700;
        }
        .fiche-type ~ .fiche-export { margin-left: 0; }
        .fiche-export:hover { background: rgba(255, 255, 255, 0.28); }
        .fiche-export:disabled { opacity: 0.6; cursor: progress; }
        .fiche-pied { display: none; margin: 14px 34px 0; color: var(--texte-doux); font-size: 0.75rem; }

        .fiche-cadrage { display: flex; gap: 48px; flex-wrap: wrap; padding: 32px 34px 10px; }
        .fiche-colonne { display: flex; flex-direction: column; gap: 28px; min-width: 240px; flex: 1; }
        .fiche-colonne.large { flex: 2.95; }
        .fiche-colonne.large { min-width: 300px; }
        .fiche-colonne.droite { flex: 2; min-width: 260px; }
        .fiche-indicateurs { display: flex; gap: 30px; flex-wrap: wrap; }
        .fiche-indicateur { flex: 1; min-width: 90px; display: flex; flex-direction: column; color: var(--teinte-fiche, var(--accent)); }
        .fiche-indicateur-valeur { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
        .fiche-indicateur-libelle { font-size: 0.8rem; line-height: 1.3; }
        .fiche-visuel { display: block; width: 100%; height: auto; border-radius: var(--rayon); background: var(--fond-doux); }
        .fiche-duo { display: flex; gap: 30px; flex-wrap: wrap; }
        .fiche-duo:empty { display: none; }
        .fiche-duo .fiche-bloc { flex: 1; min-width: 160px; }
        .fiche-jalon-date { margin-left: 8px; color: var(--teinte-fiche, var(--accent)); font-weight: 700; }
        .fiche-jalon-titre { font-size: 0.9rem; line-height: 1.4; }
        .fiche-trio { display: flex; gap: 30px; flex-wrap: wrap; margin-top: 4px; }
        .fiche-trio .fiche-bloc { flex: 1; min-width: 160px; }
        .fiche-label { display: block; color: var(--texte-libelle); font-size: 0.78rem; margin-bottom: 6px; }
        .fiche-picto { flex-shrink: 0; margin-right: 5px; vertical-align: -2px; }
        .fiche-lien { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 0.95rem; word-break: break-all; }
        .fiche-lien .fiche-picto { margin: 0 0 0 2px; }
        .fiche-valeur { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
        /* Les zones de saisie du metier ont un fond, les listes de personnes n'en ont pas. */
        .bloc-description .fiche-valeur, .bloc-actualites .fiche-valeur, .bloc-texte .fiche-valeur, .fiche-trio .fiche-valeur {
            background: var(--fond-doux); border-radius: var(--rayon); padding: 15px 17px;
            width: 100%; display: block; white-space: pre-wrap;
            font-size: 0.95rem; line-height: 1.5;
        }
        .fiche-valeur .vide { color: var(--texte-doux); font-style: italic; }
        /* Un champ qui se modifie porte un fond a peine plus bleute que ceux en lecture seule. */
        .bloc-description .fiche-valeur:has(.fiche-saisie), .bloc-actualites .fiche-valeur:has(.fiche-saisie), .bloc-texte .fiche-valeur:has(.fiche-saisie) { background: none; padding: 0; }
        .fiche-saisie {
            display: block; width: 100%; resize: none; overflow: hidden; margin: 0;
            background: var(--fond-saisie); color: var(--texte); border: 1px solid transparent;
            border-radius: var(--rayon); padding: 15px 17px; font: inherit; font-size: 0.95rem; line-height: 1.5;
        }
        .fiche-saisie:hover { border-color: var(--trait); }
        .fiche-saisie:focus { outline: none; border-color: var(--accent); }
        .fiche-saisie::placeholder { color: var(--texte-doux); font-style: italic; }
        .fiche-erreur { margin: 6px 0 0; color: #b45309; font-size: 0.8rem; }

        /* Couleurs du choix Grist quand il en porte, pastille neutre sinon. */
        .fiche-statut {
            display: inline-block; background: var(--fond-doux); color: var(--texte); border-radius: 2px;
            padding: 3px 8px; font-size: 0.9rem; font-weight: 400; line-height: 1.3;
        }

        .fiche-statut-ligne { position: relative; display: inline-flex; align-items: center; gap: 6px; }
        .fiche-statut-aide {
            display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px;
            border-radius: 50%; background: #3e5de7; color: #fff; font-size: 0.68rem; font-weight: 700; cursor: help;
        }
        .fiche-statut-aide:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
        .fiche-statut-bulle {
            display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 5;
            width: max-content; max-width: 280px; padding: 8px 10px; border-radius: var(--rayon);
            background: #292929; color: #fff; font-size: 0.8rem; line-height: 1.4; white-space: pre-wrap;
        }
        .fiche-statut-aide:hover + .fiche-statut-bulle, .fiche-statut-aide:focus + .fiche-statut-bulle { display: block; }

        .fiche-personne {
            display: inline-flex; align-items: center; gap: 8px;
            color: #fff; border-radius: 4px; padding: 12px; font-weight: 400; font-size: 0.95rem; line-height: 1.3;
        }

        .fiche-alerte {
            display: inline-flex; align-items: center; gap: 4px; color: #B3261E;
            font-weight: 400; font-size: 0.95rem; line-height: 1.3;
        }

        .fiche-route { padding: 32px 34px 0; }
        .fiche-route h2 { font-size: 0.78rem; font-weight: 800; margin: 0 0 12px; }
        .fiche-grille {
            border: 1px solid var(--trait); border-radius: var(--rayon); overflow: hidden;
            margin: 0 -28px; --colonne: clamp(200px, 28.8%, 420px); font-size: 0.76rem;
        }
        .fiche-entetes, .fiche-rang { display: flex; align-items: stretch; }
        .fiche-entetes { border-bottom: 1px solid var(--trait); }
        .fiche-corps { max-height: 62vh; overflow-y: auto; }
        /* Les calques se mesurent sur la pile et non sur la zone de defilement : ancres a celle-ci,
           ils s'arretent a sa hauteur visible et laissent nus les rangs atteints en defilant. */
        .fiche-pile { position: relative; min-height: 120px; }
        .fiche-ligne {
            flex: 0 0 var(--colonne); display: flex; align-items: center; gap: 8px;
            padding: 4px 10px; border-right: 1px solid var(--trait); overflow: hidden;
        }
        .fiche-ligne-tete { font-weight: 700; font-size: 0.9rem; padding: 12px 10px; align-items: center; }
        .fiche-intitule { min-width: 0; flex: 1; }
        /* Sans les dates, le titre dispose de deux lignes plutot que d'une coupe a l'ellipse. */
        .fiche-nom {
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
            font-weight: 700; line-height: 1.2; overflow: hidden;
        }
        .fiche-rang:not(.est-chantier) .fiche-nom { font-weight: 500; }
        .fiche-chevron {
            background: none; border: 0; cursor: pointer; color: var(--texte-doux);
            font-size: 0.48rem; padding: 0 2px; line-height: 1; flex: none;
        }
        .fiche-chevron-vide { width: 10px; flex: none; }
        .fiche-progression {
            background: var(--fond-doux); color: var(--texte-doux); border-radius: 4px;
            padding: 2px 6px; font-size: 0.58rem; flex: none;
        }
        .fiche-filles { color: var(--texte-doux); font-size: 0.58rem; flex: none; }
        .fiche-rang { border-bottom: 1px solid var(--trait); min-height: 36px; position: relative; background: transparent; }
        .fiche-rang:last-child { border-bottom: 0; }
        .fiche-piste { position: relative; flex: 1; }
        /* Bandeau du domaine du responsable sur un chantier, sur la ligne comme sur la piste. */
        .fiche-rang.avec-domaine { background-color: color-mix(in srgb, var(--teinte-domaine) 12%, transparent); min-height: 46px; }
        .fiche-rang.avec-domaine .fiche-ligne { position: relative; padding-top: 16px; }
        .fiche-rang.avec-domaine .fiche-barre { top: calc(50% + 6px); }
        .bandeau-domaine {
            position: absolute; left: 0; right: 0; top: 0; height: 12px; padding-left: 10px;
            color: #fff; font-size: 0.53rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
            line-height: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .fiche-piste .bandeau-domaine { padding-left: 0; }
        .fiche-piste-tete { display: flex; flex-direction: column; }
        .fiche-mois-ligne { display: flex; flex: 1; }
        .fiche-mois {
            display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: var(--texte-doux); font-weight: 600;
            text-transform: capitalize; padding: 4px 0; border-left: 1px solid var(--trait); overflow: hidden;
        }

        .fiche-barre {
            position: absolute; top: 50%; transform: translateY(-50%); height: 12px; border-radius: 6px;
            background: var(--teinte, #94a3b8); overflow: hidden;
        }
        .fiche-jalon {
            position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 2px;
            transform: translate(-50%, -50%) rotate(45deg); background: var(--teinte, #94a3b8);
        }
        .fiche-avancee { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0, 0, 0, 0.28); }

        /* Le trait du jour et la colonne courante se mesurent sur la piste seule : portes par le
           corps entier, la colonne des libelles les decalerait de plusieurs semaines. */
        .fiche-overlay { position: absolute; top: 0; bottom: 0; left: var(--colonne); right: 0; pointer-events: none; }
        .fiche-aujourdhui { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--aujourdhui); }
        .fiche-colonne-courante { position: absolute; top: 0; bottom: 0; background: var(--accent-clair); }
        .fiche-message { color: var(--texte-doux); padding: 14px 28px; }
        .fiche-refus { margin: 0; color: #b45309; background: #fffbeb; border-bottom: 1px solid #fde68a; }
        @media (prefers-color-scheme: dark) { .fiche-refus { color: #fcd34d; background: #2a2011; border-bottom-color: #4a3a13; } }

        .fiche-bientot {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            margin: 30px 34px; padding: 36px 28px; text-align: center;
            background: var(--fond-doux); border-radius: 10px;
        }
        .fiche-bientot-vignette {
            display: flex; align-items: center; justify-content: center;
            width: 54px; height: 54px; border-radius: 50%;
            background: var(--accent-clair); color: var(--accent);
        }
        .fiche-bientot-titre { margin: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
        .fiche-bientot-texte { margin: 0; max-width: 44ch; color: var(--texte-doux); font-size: 0.9rem; line-height: 1.5; }
        .fiche-accueil-guide {
            margin: 2px 0 0; display: inline-flex; align-items: center; gap: 10px;
            color: var(--accent); font-weight: 700; font-size: 0.9rem;
        }
        .fiche-accueil-fleche { display: inline-flex; }

        @media (max-width: 760px) {
            html:not(.impression) .fiche-cadrage { flex-direction: column; gap: 22px; padding: 20px 16px 4px; }
            html:not(.impression) .fiche-entete, html:not(.impression) .fiche-route { padding-left: 18px; padding-right: 18px; }
            html:not(.impression) .fiche-bientot { margin: 22px 16px; padding: 28px 18px; }
            html:not(.impression) .fiche-grille { margin: 0 -12px; --colonne: clamp(140px, 44%, 240px); }
            html:not(.impression) .fiche-progression, html:not(.impression) .fiche-filles { display: none; }
        }

        /* Mise en page imprimée, posée par le bouton avant l'impression pour pouvoir la mesurer. */
        html.impression {
            --fond: #ffffff; --fond-doux: #f5f7fb; --texte: #292929; --texte-libelle: #414141; --texte-doux: #6b7280;
            --trait: #e5e7eb; --accent-clair: #eaf1fd; --fond-saisie: #eef4fc;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        html.impression .fiche-titre { font-size: 1.85rem; }
        html.impression .fiche-type { font-size: 1.35rem; }
        html.impression .fiche-corps { max-height: none; overflow: visible; }
        html.impression .fiche-export, html.impression .fiche-chevron, html.impression .fiche-refus { display: none; }
        html.impression .fiche-pied { display: block; }
        @page { size: A4 landscape; margin: 10mm; }
        @media print {
            body { margin: 0; }
        }
    </style>
</head>
<body>
    <div class="fiche" id="fiche"><p class="fiche-message">Chargement…</p></div>
    <script>
        // <inline:core/taskflow-core.js> -- GENERE par scripts/build-inline.js, NE PAS EDITER ICI
        /* ============================================================================
         * taskflow-core.js — Module commun aux widgets TaskFlow
         * ----------------------------------------------------------------------------
         * SOURCE UNIQUE. Inline dans chaque widget par scripts/build-inline.js entre
         * les marqueurs de generation prevus a cet effet.
         * NE PAS editer la copie inlinee dans les .html : editer CE fichier puis lancer
         *   npm run build:inline
         *
         * Expose un objet `TF` (namespace) pour ne jamais entrer en collision avec les
         * helpers locaux existants des widgets. Toutes les fonctions qui ecrivent dans
         * Grist sont DEFENSIVES : en cas d'echec elles n'interrompent jamais le widget
         * (au pire, comportement actuel inchange).
         * ========================================================================== */
        const TF = (function () {
            'use strict';

            /* ----- Statuts ---------------------------------------------------------
             * Convention : l'ORDRE fait foi. Le DERNIER statut de la liste est l'etat
             * terminal ("termine") utilise par la logique de completion des widgets.
             * Les statuts reels proviennent de la colonne Choice `statut` (editable par
             * l'utilisateur dans Grist). DEFAULT_STATUSES n'est qu'un repli.
             * --------------------------------------------------------------------- */
            const DEFAULT_STATUSES = [
                { value: 'todo',       label: 'À faire',  fillColor: '#94a3b8', textColor: '#ffffff' },
                { value: 'inprogress', label: 'En cours', fillColor: '#f59e0b', textColor: '#ffffff' },
                { value: 'review',     label: 'En revue', fillColor: '#3b82f6', textColor: '#ffffff' },
                { value: 'done',       label: 'Terminé',  fillColor: '#10b981', textColor: '#ffffff' }
            ];
            // Repli libelle + couleur pour les CODES par defaut. Permet d'afficher un libelle
            // FR (et la bonne couleur) meme quand la colonne Choice stocke le code brut
            // (todo/inprogress/...). Une valeur renommee par l'utilisateur garde SON libelle.
            /* Statuts qui valent cloture. La convention « le dernier de la liste » ne tient pas : le metier
             * declare ses choix dans son ordre a lui et en ajoute apres la cloture, ce qui designait « En
             * attente externe » comme terminal et laissait « done » ouvert. La liste est figee ici en
             * attendant de la rendre configurable cote document ; plusieurs statuts peuvent fermer. La
             * comparaison ignore casse, accents et separateurs, les libelles etant saisis a la main. */
            const VALEURS_TERMINALES = ['done', 'termine', 'cloture', 'ferme', 'annule', 'abandonne'];
            const normaliserStatut = (v) => String(v == null ? '' : v)
                .normalize('NFD').replace(/[̀-ͯ]/g, '')
                .toLowerCase().replace(/[^a-z0-9]/g, '');
            const estValeurTerminale = (v) => VALEURS_TERMINALES.indexOf(normaliserStatut(v)) !== -1;

            const DEFAULTS_BY_VALUE = {};
            for (var _i = 0; _i < DEFAULT_STATUSES.length; _i++) DEFAULTS_BY_VALUE[DEFAULT_STATUSES[_i].value] = DEFAULT_STATUSES[_i];

            // Convertit un tableau Grist colonnaire en tableau d'objets lignes.
            function columnarToRows(data) {
                if (!data || Array.isArray(data)) return data || [];
                const cols = Object.keys(data);
                if (!cols.length) return [];
                const n = (data[cols[0]] && data[cols[0]].length) || 0;
                const rows = [];
                for (let i = 0; i < n; i++) {
                    const rec = {};
                    for (const k of cols) rec[k] = data[k][i];
                    rows.push(rec);
                }
                return rows;
            }

            // Resout le rowId d'une table depuis son tableId via _grist_Tables.
            // `meta` (optionnel) = { tables, cols } deja lus : evite un fetchTable de plus.
            async function tableRowId(grist, tableId, meta) {
                const rows = meta && meta.tables ? meta.tables : columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
                const row = rows.find(r => r.tableId === tableId);
                return row ? row.id : null;
            }

            // Lit les deux tables de metadonnees en une passe (parallele), a partager entre helpers.
            // Grist marque isFormula une colonne neuve encore vide : seule une formule non vide la rend calculee.
            const estCalculee = (c) => !!(c && c.isFormula && c.formula);

            async function fetchSchemaMeta(grist) {
                const [t, c] = await Promise.all([
                    grist.docApi.fetchTable('_grist_Tables'),
                    grist.docApi.fetchTable('_grist_Tables_column')
                ]);
                return { tables: columnarToRows(t), cols: columnarToRows(c) };
            }

            // Construit une config de statuts normalisee depuis une liste brute.
            function buildStatusConfig(list, source) {
                const clean = (list || []).filter(s => s && s.value != null).map(s => {
                    const v = String(s.value);
                    const d = DEFAULTS_BY_VALUE[v];
                    const hasExplicitLabel = s.label != null && s.label !== '' && String(s.label) !== v;
                    return {
                        value: v,
                        label: hasExplicitLabel ? String(s.label) : (d ? d.label : v),
                        fillColor: s.fillColor || (d ? d.fillColor : '#94a3b8'),
                        textColor: s.textColor || (d ? d.textColor : '#ffffff')
                    };
                });
                const final = clean.length ? clean : DEFAULT_STATUSES.slice();
                // Sans aucune valeur reconnue, la convention historique vaut mieux que pas de cloture.
                const reconnus = final.filter(s => estValeurTerminale(s.value)).map(s => s.value);
                const terminaux = reconnus.length ? reconnus : [final[final.length - 1].value];
                const byValue = {};
                for (const s of final) byValue[s.value] = s;
                return {
                    list: final,
                    byValue,
                    values: final.map(s => s.value),
                    terminalValues: terminaux,
                    terminalValue: terminaux[0],
                    firstValue: final[0].value,
                    source: clean.length ? source : 'default'
                };
            }

            /* Lit les statuts (libelles + couleurs + ordre) depuis la colonne Choice
             * indiquee, via les metadonnees Grist. Repli en cascade :
             *   1. options de la colonne Choice (cas ideal)
             *   2. valeurs distinctes presentes dans les donnees (colonne Text)
             *   3. DEFAULT_STATUSES
             * Ne jette jamais : retourne toujours une config exploitable.
             */
            async function loadStatusConfig(grist, table, column, distinctFallback, meta) {
                try {
                    const tid = await tableRowId(grist, table, meta);
                    if (tid != null) {
                        const cols = meta && meta.cols ? meta.cols : columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                        const col = cols.find(c => c.parentId === tid && c.colId === column);
                        if (col && col.widgetOptions) {
                            let opt = {};
                            try { opt = JSON.parse(col.widgetOptions) || {}; } catch (e) { opt = {}; }
                            const choices = Array.isArray(opt.choices) ? opt.choices : [];
                            const co = opt.choiceOptions || {};
                            if (choices.length) {
                                return buildStatusConfig(choices.map(ch => ({
                                    value: ch,
                                    label: ch,
                                    fillColor: co[ch] && co[ch].fillColor,
                                    textColor: co[ch] && co[ch].textColor
                                })), 'choice');
                            }
                        }
                    }
                } catch (e) { /* repli silencieux */ }

                if (Array.isArray(distinctFallback) && distinctFallback.length) {
                    const seen = [];
                    for (const v of distinctFallback) { if (v != null && v !== '' && seen.indexOf(v) === -1) seen.push(v); }
                    if (seen.length) return buildStatusConfig(seen.map(v => ({ value: v, label: v })), 'data');
                }
                return buildStatusConfig(DEFAULT_STATUSES.slice(), 'default');
            }

            function getStatus(cfg, value) {
                if (cfg && cfg.byValue && cfg.byValue[value]) return cfg.byValue[value];
                return { value: value, label: value || '', fillColor: '#94a3b8', textColor: '#ffffff' };
            }
            function isTerminal(cfg, value) {
                if (!cfg) return false;
                const liste = cfg.terminalValues || (cfg.terminalValue ? [cfg.terminalValue] : []);
                return liste.indexOf(value) !== -1;
            }

            /* Seme les options (choix + couleurs) sur une colonne Choice si elle n'en a
             * pas encore. Defensif. A appeler depuis ensureSchema apres creation.
             */
            async function seedStatusChoices(grist, table, column, statuses, meta) {
                try {
                    const tid = await tableRowId(grist, table, meta);
                    if (tid == null) return;
                    const cols = meta && meta.cols ? meta.cols : columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                    const col = cols.find(c => c.parentId === tid && c.colId === column);
                    if (!col) return;
                    let opt = {};
                    try { opt = JSON.parse(col.widgetOptions || '{}') || {}; } catch (e) { opt = {}; }
                    if (Array.isArray(opt.choices) && opt.choices.length) return; // deja configure : on respecte
                    const list = statuses && statuses.length ? statuses : DEFAULT_STATUSES;
                    const choiceOptions = {};
                    for (const s of list) choiceOptions[s.value] = { fillColor: s.fillColor, textColor: s.textColor };
                    const widgetOptions = JSON.stringify({ choices: list.map(s => s.value), choiceOptions: choiceOptions });
                    await grist.docApi.applyUserActions([['ModifyColumn', table, column, { widgetOptions: widgetOptions }]]);
                } catch (e) { console.warn('TF.seedStatusChoices:', e && e.message); }
            }

            /* ----- #2 : colonnes d'affichage des Ref (noms au lieu des IDs) ---------
             * Pose le visibleCol + la display formula sur des colonnes Ref pour que les
             * VUES NATIVES Grist affichent un libelle plutot que l'ID de ligne.
             * specs : [{ table:'Tasks', column:'projet', visibleColId:'nom' }, ...]
             * DEFENSIF : si Grist refuse une action, on log et on continue ; au pire
             * l'affichage reste en IDs (comportement actuel), jamais de casse.
             * --------------------------------------------------------------------- */
            async function setRefDisplayColumns(grist, specs, meta) {
                if (!Array.isArray(specs) || !specs.length) return;
                try {
                    const tables = meta && meta.tables ? meta.tables : columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
                    const cols = meta && meta.cols ? meta.cols : columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                    const tidOf = (tableId) => { const r = tables.find(t => t.tableId === tableId); return r ? r.id : null; };
                    const colOf = (tableRow, colId) => cols.find(c => c.parentId === tableRow && c.colId === colId);

                    const actions = [];
                    for (const s of specs) {
                        const srcTid = tidOf(s.table);
                        if (srcTid == null) continue;
                        const refCol = colOf(srcTid, s.column);
                        if (!refCol) continue;
                        // Table cible deduite du type "Ref:Target" / "RefList:Target".
                        const m = /^(?:Ref|RefList):(.+)$/.exec(refCol.type || '');
                        if (!m) continue;
                        const targetTid = tidOf(m[1]);
                        if (targetTid == null) continue;
                        const visCol = colOf(targetTid, s.visibleColId);
                        if (!visCol) continue;
                        // Eviter de re-poser si deja correct.
                        if (refCol.visibleCol === visCol.id) continue;
                        actions.push(['SetDisplayFormula', s.table, null, refCol.id, '$' + s.column + '.' + s.visibleColId]);
                        actions.push(['UpdateRecord', '_grist_Tables_column', refCol.id, { visibleCol: visCol.id }]);
                    }
                    if (actions.length) await grist.docApi.applyUserActions(actions);
                } catch (e) { console.warn('TF.setRefDisplayColumns:', e && e.message); }
            }

            /* ----- #2bis : delier colId <-> label (renommage libre des libelles) ----
             * Pose untieColIdFromLabel=true sur les colonnes du widget. Sans ca, Grist
             * regenere le colId a chaque changement de libelle, et le widget (qui lit et
             * ecrit tout par colId) perd ses colonnes. Idempotent (saute les colonnes
             * deja deliees) et defensif (jamais de casse), applique aux docs neufs comme
             * existants a chaque ouverture.
             * tableColumns : { Tasks:['titre',...], Team:[...], Projects:[...] }
             * --------------------------------------------------------------------- */
            async function ensureUntiedLabels(grist, tableColumns, meta) {
                if (!tableColumns) return;
                try {
                    const tables = meta && meta.tables ? meta.tables : columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
                    const cols = meta && meta.cols ? meta.cols : columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                    const tidOf = (tableId) => { const r = tables.find(t => t.tableId === tableId); return r ? r.id : null; };
                    const actions = [];
                    for (const tableName of Object.keys(tableColumns)) {
                        const tid = tidOf(tableName);
                        if (tid == null) continue;
                        for (const colId of tableColumns[tableName] || []) {
                            const col = cols.find(c => c.parentId === tid && c.colId === colId);
                            if (!col) continue;
                            if (col.untieColIdFromLabel === true) continue;
                            actions.push(['ModifyColumn', tableName, colId, { untieColIdFromLabel: true }]);
                        }
                    }
                    if (actions.length) await grist.docApi.applyUserActions(actions);
                } catch (e) { console.warn('TF.ensureUntiedLabels:', e && e.message); }
            }

            /* ----- #3 : plan de charge (heures par personne) ------------------------
             * Stockage : colonne Text `charges` sur Tasks, JSON [{teamId, heures}].
             * Parse defensif identique au pattern subtasks.
             * --------------------------------------------------------------------- */
            function parseCharges(v) {
                try {
                    const a = JSON.parse(v || '[]');
                    if (!Array.isArray(a)) return [];
                    return a.filter(x => x && x.teamId != null)
                            .map(x => ({ teamId: Number(x.teamId), heures: Number(x.heures) || 0 }))
                            .filter(x => !isNaN(x.teamId));
                } catch (e) { return []; }
            }
            function chargesToJson(arr) {
                return JSON.stringify((arr || [])
                    .filter(x => x && x.teamId != null)
                    .map(x => ({ teamId: Number(x.teamId), heures: Number(x.heures) || 0 }))
                    .filter(x => !isNaN(x.teamId)));
            }
            // Heures totales d'une tache (somme des charges par personne).
            function chargeTotal(charges) { return parseCharges(typeof charges === 'string' ? charges : JSON.stringify(charges || [])).reduce((s, c) => s + c.heures, 0); }
            // Agrege la charge par membre sur une liste de taches (chaque tache expose .charges).
            function chargeByMember(tasks) {
                const by = {};
                for (const t of (tasks || [])) {
                    for (const c of parseCharges(t && t.charges)) {
                        by[c.teamId] = (by[c.teamId] || 0) + c.heures;
                    }
                }
                return by;
            }

            // Cle de periode : semaine ISO 'YYYY-Www' ou mois 'YYYY-MM'.
            function periodKey(date, granularity) {
                if (granularity === 'month') {
                    return date.getUTCFullYear() + '-' + String(date.getUTCMonth() + 1).padStart(2, '0');
                }
                const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
                const day = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - day);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
                return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
            }

            // #3 plan de charge temporel : etale les charges PROPRES de chaque tache sur sa
            // duree (jours calendaires), agrege par personne et par periode.
            // dateDebut/dateEcheance = timestamps Unix SECONDES (Grist). Tache sans dates ou
            // sans charge = ignoree. Retourne { teamId: { periodKey: heures } }.
            function chargeByMemberPeriod(tasks, granularity) {
                const g = granularity === 'month' ? 'month' : 'week';
                const out = {};
                for (const t of (tasks || [])) {
                    const charges = parseCharges(t && t.charges);
                    if (!charges.length) continue;
                    const s = t.dateDebut, e = t.dateEcheance;
                    if (s == null || e == null) continue;
                    const day0 = Math.floor((s * 1000) / 86400000);
                    const day1 = Math.floor((e * 1000) / 86400000);
                    const nDays = Math.max(day1 - day0 + 1, 1);
                    for (const c of charges) {
                        const perDay = (Number(c.heures) || 0) / nDays;
                        if (!perDay) continue;
                        if (!out[c.teamId]) out[c.teamId] = {};
                        for (let dd = day0; dd <= day1; dd++) {
                            const key = periodKey(new Date(dd * 86400000), g);
                            out[c.teamId][key] = (out[c.teamId][key] || 0) + perDay;
                        }
                    }
                }
                return out;
            }

            // Decale une date de n periodes (semaine = 7 jours, mois = 1 mois).
            function shiftPeriods(date, granularity, n) {
                const d = new Date(date.getTime());
                if (granularity === 'month') d.setUTCMonth(d.getUTCMonth() + n);
                else d.setUTCDate(d.getUTCDate() + n * 7);
                return d;
            }

            // Liste contigue de cles de periode (semaine ISO ou mois) a partir d'une date,
            // alignee sur le debut de periode (lundi / 1er du mois). Inclut les periodes vides.
            function periodRange(startDate, granularity, count) {
                const g = granularity === 'month' ? 'month' : 'week';
                let d = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth(), startDate.getUTCDate()));
                if (g === 'week') { const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() - day + 1); }
                else { d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)); }
                const out = [];
                for (let i = 0; i < count; i++) {
                    out.push(periodKey(d, g));
                    if (g === 'week') d.setUTCDate(d.getUTCDate() + 7);
                    else d.setUTCMonth(d.getUTCMonth() + 1);
                }
                return out;
            }

            // chargeMatrix : generalise chargeByMemberPeriod. Etale les charges (via getCharges,
            // defaut parseCharges) sur la duree, agrege par cle keyFn(t, charge) et periode.
            function chargeMatrix(tasks, keyFn, granularity, getCharges, workdays) {
                const g = granularity === 'month' ? 'month' : 'week';
                const out = {};
                for (const t of (tasks || [])) {
                    const charges = getCharges ? getCharges(t) : parseCharges(t && t.charges);
                    if (!charges.length || t.dateDebut == null || t.dateEcheance == null) continue;
                    const d0 = Math.floor((t.dateDebut * 1000) / 86400000), d1 = Math.floor((t.dateEcheance * 1000) / 86400000);
                    const days = [];
                    for (let dd = d0; dd <= d1; dd++) { if (workdays) { const wd = new Date(dd * 86400000).getUTCDay(); if (wd < 1 || wd > 5) continue; } days.push(dd); }
                    if (!days.length) days.push(d0);
                    for (const c of charges) {
                        const key = keyFn(t, c); if (key == null) continue;
                        const perDay = c.heures / days.length; if (!perDay) continue;
                        if (!out[key]) out[key] = {};
                        for (const dd of days) { const pk = periodKey(new Date(dd * 86400000), g); out[key][pk] = (out[key][pk] || 0) + perDay; }
                    }
                }
                return out;
            }

            /* ----- Timeline Gantt : calcul pur de l'echelle -------------------------
             * Extrait de gantt.html (computeEffectiveRange) pour etre partage avec le
             * Gantt de fiche. Aucun effet de bord (ni etat, ni DOM) : rend les nombres,
             * l'appelant les applique. Math des dates repliquee a l'identique.
             * Entree : { tasks:[{start:Date|null,end:Date|null}], unit:'day'|'week'|'month',
             *   cellWidth:number, viewStart:Date, viewDays:number, availableWidth:number,
             *   extendLeft?:boolean }
             * extendLeft a false fige le debut de plage sur viewStart : les vues glissantes s'y
             * ancrent pour tenir la ligne du jour au bord, les barres anterieures restent tronquees
             * a gauche par computeBarGeometry.
             * Sortie : { effectiveStart:Date, effectiveDays, numCells, cellWidth, pxPerDay }
             * --------------------------------------------------------------------- */
            function computeTimelineScale(opts) {
                const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
                const daysDiff = (a, b) => Math.round((b - a) / 86400000);
                const startOfWeek = (d) => { const r = new Date(d); const day = r.getDay(); r.setDate(r.getDate() - day + (day === 0 ? -6 : 1)); r.setHours(0, 0, 0, 0); return r; };
