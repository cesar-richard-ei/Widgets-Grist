version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      release:
        patterns:
          - '*'
    # semantic-release tire @semantic-release/npm, qui installe npm et son arbre embarqué. Ces
    # deux paquets vivent dans le tarball de npm : ni un override ni un audit fix ne les atteint,
    # seule une version de npm les corrigera. Le plugin lui-même n'est pas chargé, il ne figure
    # pas dans .releaserc.json.
    ignore:
      - dependency-name: undici
      - dependency-name: ip-address
