name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'published/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:  # Permet le déclenchement manuel

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: dev-src

      - name: Résoudre la dernière release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name || true)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout de la release
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: prod-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construire le site
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"

          build() {
            (
              cd "$1"
              npm ci --ignore-scripts || npm install --ignore-scripts
              npm run build --if-present
              GITHUB_USER="$owner" REPO_NAME="$repo" BASE_URL="$2" node scripts/generate-manifest.js
            )
          }

          prod_src=prod-src
          if [ ! -d "$prod_src" ]; then
            echo "::warning::Aucune release publiée : la racine est servie depuis main"
            prod_src=dev-src
          fi

          build "$prod_src" "$base"
          mkdir -p site
          cp -r "$prod_src/published/." site/

          build dev-src "${base}/dev"
          mkdir -p site/dev
          cp -r dev-src/published/. site/dev/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
