name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'published/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:  # Permet le déclenchement manuel

permissions:
  contents: read

concurrency:
  group: "pages"
  # Chaque execution reconstruit le site entier : annuler celle en cours ne perd rien, et deux
  # deploiements a quelques secondes d'intervalle (merge suivi d'une release) ont deja abouti a
  # ce que le plus recent soit actif sans etre servi.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout main
        # Sur un push, on construit le commit qui a declenche le run et pas la
        # tete de main, qui peut avoir avance entre-temps.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          path: dev-src
          persist-credentials: false

      - name: Résoudre la dernière release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name || true)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout de la release
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: prod-src
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: dev-src/.nvmrc
          # Pas de cache npm sur le chemin de deploiement : le contenu servi ne
          # doit dependre que du depot.
          package-manager-cache: false

      - name: Construire le site
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"

          build() {
            (
              cd "$1"
              npm ci --ignore-scripts || npm install --ignore-scripts
              npm run build --if-present
              GITHUB_USER="$owner" REPO_NAME="$repo" BASE_URL="$2" node scripts/generate-manifest.js
            )
          }

          prod_src=prod-src
          if [ ! -d "$prod_src" ]; then
            echo "::warning::Aucune release publiée : la racine est servie depuis main"
            prod_src=dev-src
          fi

          build "$prod_src" "$base"
          mkdir -p site
          cp -r "$prod_src/published/." site/

          build dev-src "${base}/dev"
          mkdir -p site/dev
          cp -r dev-src/published/. site/dev/

          echo "Arborescence du site :"
          find site -maxdepth 2 -mindepth 1 | sort
          echo "URL du premier widget, racine : $(node -e 'process.stdout.write(require("./site/manifest.json")[0].url)')"
          echo "URL du premier widget, dev    : $(node -e 'process.stdout.write(require("./site/dev/manifest.json")[0].url)')"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
