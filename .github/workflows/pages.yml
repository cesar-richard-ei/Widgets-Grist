name: Pages

# Appele par ci.yml apres les tests sur main, et par release.yml apres la creation d'une release.
# La racine sert la derniere release, /dev/ suit main : les deux sont reconstruits a chaque appel.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Construction du site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout main
        # On construit le commit valide par les jobs precedents et pas la tete
        # de main, qui peut avoir avance entre-temps.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          path: dev-src
          # Historique complet : le manifest date chaque widget depuis les commits, et l'estampille
          # de la nightly vient de `git describe`.
          fetch-depth: 0
          persist-credentials: false

      - name: Résoudre la dernière release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name || true)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout de la release
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: prod-src
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: dev-src/.nvmrc
          # Pas de cache npm sur le chemin de deploiement : le contenu servi ne
          # doit dependre que du depot.
          package-manager-cache: false

      - name: Construire le site
        env:
          # Passee par l'environnement plutot qu'interpolee dans le script : une expression posee
          # directement dans un bloc run est un vecteur d'injection (zizmor, template-injection).
          VERSION_RACINE: ${{ steps.release.outputs.tag || 'dev' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"

          build() {
            (
              cd "$1"
              npm ci --ignore-scripts || {
                echo "::warning::Lockfile desynchronise dans $1, repli sur npm install"
                npm install --ignore-scripts
              }
              npm run build --if-present
              GITHUB_USER="$owner" REPO_NAME="$repo" BASE_URL="$2" node scripts/generate-manifest.js
            )
          }

          prod_src=prod-src
          if [ ! -d "$prod_src" ]; then
            echo "::warning::Aucune release publiée : la racine est servie depuis main"
            prod_src=dev-src
          fi

          # Version servie, lue par les widgets pour le repere de deploiement : le tag a la racine,
          # et pour la nightly la distance a la derniere version livree, par exemple
          # v1.19.2-12-gbfa201d. Sans release, la racine vient de main et l'annonce.
          estampiller() {
            find "$1" -name '*.html' -type f -exec sed -i "s/__VERSION_TASKFLOW__/$2/g" {} +
          }

          version_dev=$(git -C dev-src describe --tags --always 2>/dev/null || echo dev)

          build "$prod_src" "$base"
          mkdir -p site
          cp -r "$prod_src/published/." site/
          estampiller site "${VERSION_RACINE}"

          build dev-src "${base}/dev"
          mkdir -p site/dev
          cp -r dev-src/published/. site/dev/
          estampiller site/dev "${version_dev}"

          echo "Arborescence du site :"
          find site -maxdepth 2 -mindepth 1 | sort
          echo "Version racine : ${VERSION_RACINE}, version nightly : ${version_dev}"
          echo "URL du premier widget, racine : $(node -e 'process.stdout.write(require("./site/manifest.json")[0].url)')"
          echo "URL du premier widget, dev    : $(node -e 'process.stdout.write(require("./site/dev/manifest.json")[0].url)')"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './site'

  deploy:
    name: Déploiement GitHub Pages
    needs: [build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      # Un deploiement en cours n'est pas interrompu : deux publications a
      # quelques secondes d'intervalle s'enchainent, la plus recente reste active.
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
