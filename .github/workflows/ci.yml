name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On n'annule que les runs de PR : un run de main doit aller jusqu'a la publication de /dev/.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Lint des workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm --volume "${PWD}:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: zizmor
        run: pipx run zizmor==1.29.0 --persona regular .github/workflows

  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] les caches ne servent qu'aux tests, le
        # site publie est construit sans cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Synchronisation des sources inlinees
        run: npm run check:inline

      - name: Lint JavaScript
        run: npm run lint

  commits:
    name: Messages de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Convention des messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commits.js "${BASE}..${TETE}"

  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] les caches ne servent qu'aux tests, le
        # site publie est construit sans cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Installation du navigateur
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Rapport d'echec
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Contexte unique exige par le ruleset de main : il agrege les jobs au-dessus,
  # qui peuvent donc bouger sans toucher aux reglages du depot.
  tests:
    name: tests
    if: always()
    needs: [workflows, unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verdict
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Jobs : ${RESULTATS}"
          case "${RESULTATS}" in
            *failure*|*cancelled*|*skipped*) exit 1 ;;
          esac

  publication:
    name: Publication du site
    # Sur main uniquement : /dev/ suit la branche, la racine attend une release.
    if: github.event_name != 'pull_request'
    needs: [tests]
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
